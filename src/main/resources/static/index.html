<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ATM Simulator System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="atm-container">
    <h1>🏦 ATM Simulator</h1>

    <div class="section">
      <h2>Create Account</h2>
      <input id="holderName" placeholder="Holder Name">
      <input id="accountNumber" placeholder="Account Number">
      <input id="initialBalance" type="number" placeholder="Initial Balance">
      <button onclick="createAccount()">Create</button>
    </div>

    <div class="section">
      <h2>Deposit / Withdraw</h2>
      <input id="accountId" type="number" placeholder="Enter Account Number">
      <input id="amount" type="number" placeholder="Amount">
      <button onclick="deposit()">Deposit</button>
      <button onclick="withdraw()">Withdraw</button>
    </div>

    <div class="section">
      <h2>Check Balance</h2>
      <input id="checkAccountNumber" placeholder="Account Number">
      <button onclick="checkBalance()">Check</button>
      <p id="balanceResult"></p>
    </div>
<h2>Transaction History</h2>
<input type="number" id="historyAccountId" placeholder="Enter Account Number">
<button onclick="showHistory()">Show History</button>
<input type="number" id="miniStmtId" placeholder="Account ID">
<button onclick="downloadMiniStatement()">Download Mini Statement</button>

<table border="1" id="historyTable">
  <thead>
    <tr>
      <th>ID</th>
      <th>Type</th>
      <th>Amount</th>
      <th>Date</th>
      <th>Description</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

  </div>

  <script src="script.js" type="text/javascript"></script>

</body>
</html>
